<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>楽天ROOMおすすめ商品</title>


<style>

/* =================================
基本設定
================================= */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;

  background: #f5f5f5;

  color: #333;

}


/* =================================
ヘッダー
================================= */

header {

  background: #bf0000;

  color: white;

  padding: 30px 20px;

  text-align: center;

}


header h1 {

  margin: 0 0 10px;

  font-size: 28px;

}


header p {

  margin: 0;

  font-size: 16px;

}


/* =================================
メイン
================================= */

.container {

  max-width: 1100px;

  margin: 30px auto;

  padding: 0 20px;

}


/* =================================
検索エリア
================================= */

.search-box {

  background: white;

  padding: 20px;

  border-radius: 12px;

  box-shadow:
    0 2px 10px
    rgba(0, 0, 0, .08);

  margin-bottom: 25px;

}


.search-box h2 {

  margin-top: 0;

}


.search-area {

  display: flex;

  gap: 10px;

}


.search-area input {

  flex: 1;

  padding: 14px;

  border:
    1px solid #ccc;

  border-radius: 6px;

  font-size: 16px;

}


.search-area button {

  padding:
    14px 25px;

  background: #bf0000;

  color: white;

  border: none;

  border-radius: 6px;

  font-size: 16px;

  cursor: pointer;

}


.search-area button:hover {

  background: #990000;

}


.search-area button:disabled {

  background: #999;

  cursor: not-allowed;

}


/* =================================
検索結果情報
================================= */

#result-info {

  margin-bottom: 20px;

  font-size: 15px;

  color: #666;

}


/* =================================
商品一覧
================================= */

#products {

  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(230px, 1fr)
    );

  gap: 20px;

}


/* =================================
商品カード
================================= */

.product {

  background: white;

  border-radius: 12px;

  overflow: hidden;

  box-shadow:
    0 2px 10px
    rgba(0, 0, 0, .08);

  display: flex;

  flex-direction: column;

}


.product img {

  width: 100%;

  height: 220px;

  object-fit: contain;

  background: #fff;

  padding: 10px;

}


.product-info {

  padding: 15px;

  display: flex;

  flex-direction: column;

  flex: 1;

}


.product-name {

  font-size: 15px;

  font-weight: bold;

  line-height: 1.5;

  margin-bottom: 10px;

  display: -webkit-box;

  -webkit-line-clamp: 3;

  -webkit-box-orient: vertical;

  overflow: hidden;

}


.price {

  color: #bf0000;

  font-size: 20px;

  font-weight: bold;

  margin-bottom: 15px;

}


.product a {

  display: block;

  margin-top: auto;

  text-align: center;

  padding: 12px;

  background: #bf0000;

  color: white;

  text-decoration: none;

  border-radius: 6px;

  font-weight: bold;

}


.product a:hover {

  background: #990000;

}


/* =================================
メッセージ
================================= */

.message {

  background: white;

  padding: 30px;

  border-radius: 10px;

  text-align: center;

  grid-column: 1 / -1;

}


/* =================================
もっと見る
================================= */

.load-more-area {

  text-align: center;

  margin:
    30px 0
    10px;

}


#load-more {

  padding:
    15px 50px;

  background: #bf0000;

  color: white;

  border: none;

  border-radius: 8px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}


#load-more:hover {

  background: #990000;

}


#load-more:disabled {

  background: #999;

  cursor: not-allowed;

}


/* =================================
スマホ
================================= */

@media (max-width: 600px) {

  .search-area {

    flex-direction: column;

  }


  header h1 {

    font-size: 24px;

  }


  #products {

    grid-template-columns:
      repeat(
        2,
        minmax(0, 1fr)
      );

    gap: 10px;

  }


  .product img {

    height: 160px;

  }


  .product-info {

    padding: 10px;

  }


  .product-name {

    font-size: 13px;

  }


  .price {

    font-size: 16px;

  }


  .product a {

    padding: 10px 5px;

    font-size: 13px;

  }

}

</style>

</head>


<body>


<!-- =================================
ヘッダー
================================= -->

<header>

  <h1>
    楽天ROOMおすすめ商品
  </h1>

  <p>
    楽天ROOMで紹介しているおすすめ商品
  </p>

</header>


<!-- =================================
メイン
================================= -->

<div class="container">


  <!-- 検索 -->

  <div class="search-box">

    <h2>
      商品を検索
    </h2>


    <div class="search-area">

      <input
        type="text"
        id="keyword"
        placeholder="例：スニーカー、バッグ、家電"
      >


      <button
        type="button"
        id="search-button"
        onclick="searchProducts()"
      >
        検索
      </button>

    </div>

  </div>


  <!-- 検索結果情報 -->

  <div id="result-info"></div>


  <!-- 商品一覧 -->

  <div id="products">

    <div class="message">

      キーワードを入力して
      「検索」を押してください。

    </div>

  </div>


  <!-- もっと見る -->

  <div
    class="load-more-area"
    id="load-more-area"
    style="display:none;"
  >

    <button
      type="button"
      id="load-more"
      onclick="showMoreProducts()"
    >
      もっと見る
    </button>

  </div>


</div>



<script>

/* =================================
Cloudflare Worker
================================= */

const WORKER_API =
  "https://rakuten-room.you626-m.workers.dev/api/search";


/* =================================
設定
================================= */

/* 最大100件 */

const MAX_PRODUCTS = 100;


/* 最初に表示する件数 */

const INITIAL_DISPLAY = 50;


/* 「もっと見る」1回ごとの件数 */

const LOAD_MORE_COUNT = 25;


/* 楽天API 1ページの件数 */

const API_PAGE_SIZE = 30;


/* =================================
変数
================================= */

let allProducts = [];

let displayedCount = 0;


/* =================================
商品検索
================================= */

async function searchProducts() {

  const keyword =
    document
      .getElementById("keyword")
      .value
      .trim();


  if (!keyword) {

    alert(
      "検索キーワードを入力してください。"
    );

    return;

  }


  const products =
    document.getElementById("products");


  const resultInfo =
    document.getElementById("result-info");


  const searchButton =
    document.getElementById(
      "search-button"
    );


  const loadMoreArea =
    document.getElementById(
      "load-more-area"
    );


  /* 初期化 */

  allProducts = [];

  displayedCount = 0;


  loadMoreArea.style.display =
    "none";


  resultInfo.innerHTML =
    "";


  products.innerHTML = `

    <div class="message">

      商品を検索しています...

    </div>

  `;


  searchButton.disabled =
    true;


  searchButton.textContent =
    "検索中...";


  try {

    /*
    最大100件取得するため

    1ページ30件 × 4ページ
    = 最大120件取得

    その後100件に制限
    */

    const pages = [
      1,
      2,
      3,
      4
    ];


    const requests =
      pages.map(
        function(page) {

          const apiUrl =
            WORKER_API +
            "?keyword=" +
            encodeURIComponent(
              keyword
            ) +
            "&page=" +
            page;


          return fetch(apiUrl)
            .then(
              async function(response) {

                const data =
                  await response.json();


                if (!response.ok) {

                  throw new Error(

                    data.error ||

                    data.details
                      ?.errors
                      ?.errorMessage ||

                    "楽天APIエラー"

                  );

                }


                return data;

              }
            );

        }
      );


    const results =
      await Promise.all(
        requests
      );


    let items = [];


    results.forEach(
      function(data) {

        const pageItems =
          data.Items ||
          data.items ||
          [];


        if (
          Array.isArray(
            pageItems
          )
        ) {

          items =
            items.concat(
              pageItems
            );

        }

      }
    );


    /* =================================
    商品データを統一
    ================================= */

    const normalizedProducts =
      items.map(
        function(item) {

          return (
            item.Item ||
            item
          );

        }
      );


    /* =================================
    重複削除
    ================================= */

    const uniqueProducts =
      [];


    const urlSet =
      new Set();


    normalizedProducts.forEach(
      function(product) {

        const productUrl =
          product.itemUrl ||
          product.affiliateUrl ||
          product.itemCode ||
          "";


        if (

          productUrl &&

          !urlSet.has(
            productUrl
          )

        ) {

          urlSet.add(
            productUrl
          );


          uniqueProducts.push(
            product
          );

        }

      }
    );


    /* 最大100件 */

    allProducts =
      uniqueProducts.slice(
        0,
        MAX_PRODUCTS
      );


    /* 商品なし */

    if (

      allProducts.length === 0

    ) {

      products.innerHTML = `

        <div class="message">

          商品が見つかりませんでした。

        </div>

      `;


      return;

    }


    /* 商品一覧を空にする */

    products.innerHTML =
      "";


    /* 最初の50件 */

    showProducts(
      INITIAL_DISPLAY
    );


  } catch (error) {

    console.error(
      "商品検索エラー:",
      error
    );


    products.innerHTML = `

      <div class="message">

        商品を取得できませんでした。

        <br><br>

        ${escapeHtml(
          error.message
        )}

        <br><br>

        少し時間をおいて、
        もう一度検索してください。

      </div>

    `;


  } finally {

    searchButton.disabled =
      false;


    searchButton.textContent =
      "検索";

  }

}



/* =================================
指定件数まで商品を表示
================================= */

function showProducts(
  count
) {

  const products =
    document.getElementById(
      "products"
    );


  const loadMoreArea =
    document.getElementById(
      "load-more-area"
    );


  const resultInfo =
    document.getElementById(
      "result-info"
    );


  const endIndex =
    Math.min(

      displayedCount +
      count,

      allProducts.length

    );


  for (

    let i =
      displayedCount;

    i < endIndex;

    i++

  ) {

    const product =
      allProducts[i];


    const card =
      createProductCard(
        product
      );


    products.appendChild(
      card
    );

  }


  displayedCount =
    endIndex;


  /* 表示件数 */

  resultInfo.textContent =
    `現在 ${displayedCount}件 / 最大 ${allProducts.length}件表示`;


  /* まだ商品がある場合 */

  if (

    displayedCount <
    allProducts.length

  ) {

    loadMoreArea.style.display =
      "block";

  } else {

    loadMoreArea.style.display =
      "none";

  }

}



/* =================================
もっと見る
================================= */

function showMoreProducts() {

  const loadMoreButton =
    document.getElementById(
      "load-more"
    );


  loadMoreButton.disabled =
    true;


  loadMoreButton.textContent =
    "読み込み中...";


  setTimeout(
    function() {

      showProducts(
        LOAD_MORE_COUNT
      );


      loadMoreButton.disabled =
        false;


      loadMoreButton.textContent =
        "もっと見る";

    },
    100
  );

}



/* =================================
商品カード作成
================================= */

function createProductCard(
  product
) {

  const itemName =
    product.itemName ||
    "商品名なし";


  const rawPrice =
    product.itemPrice;


  let itemPrice =
    "価格情報なし";


  if (

    rawPrice !== undefined &&

    rawPrice !== null &&

    rawPrice !== ""

  ) {

    itemPrice =
      Number(
        rawPrice
      ).toLocaleString();

  }


  /* =================================
  商品URL
  ================================= */

  const itemUrl =
    product.affiliateUrl ||
    product.itemUrl ||
    "#";


  /* =================================
  商品画像
  ================================= */

  let imageUrl =
    "";


  if (

    product.mediumImageUrls &&

    product.mediumImageUrls.length > 0

  ) {

    const image =
      product.mediumImageUrls[0];


    imageUrl =
      image.imageUrl ||
      image;

  }


  /* mediumImageUrlsがない場合 */

  if (

    !imageUrl &&

    product.imageFlag !== 0

  ) {

    if (

      product.smallImageUrls &&

      product.smallImageUrls.length > 0

    ) {

      const image =
        product.smallImageUrls[0];


      imageUrl =
        image.imageUrl ||
        image;

    }

  }


  /* 画像なし */

  if (!imageUrl) {

    imageUrl =
      "data:image/svg+xml;charset=UTF-8," +

      encodeURIComponent(`

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="400"
          height="400"
        >

          <rect
            width="100%"
            height="100%"
            fill="#eeeeee"
          />

          <text
            x="50%"
            y="50%"
            text-anchor="middle"
            dominant-baseline="middle"
            fill="#999999"
            font-size="20"
          >

            No Image

          </text>

        </svg>

      `);

  }


  /* =================================
  カード作成
  ================================= */

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "product";


  card.innerHTML = `

    <img
      src="${escapeHtml(imageUrl)}"
      alt="${escapeHtml(itemName)}"
      loading="lazy"
    >


    <div class="product-info">


      <div
        class="product-name"
      >

        ${escapeHtml(itemName)}

      </div>


      <div
        class="price"
      >

        ${itemPrice === "価格情報なし"

          ? "価格情報なし"

          : escapeHtml(itemPrice) + "円"

        }

      </div>


      <a

        href="${escapeHtml(itemUrl)}"

        target="_blank"

        rel="noopener noreferrer"

      >

        楽天市場で見る

      </a>


    </div>

  `;


  return card;

}



/* =================================
HTMLエスケープ
================================= */

function escapeHtml(
  text
) {

  return String(
    text
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =================================
Enterキーで検索
================================= */

document
  .getElementById(
    "keyword"
  )
  .addEventListener(

    "keydown",

    function(event) {

      if (

        event.key ===
        "Enter"

      ) {

        searchProducts();

      }

    }

  );

</script>


</body>

</html>
