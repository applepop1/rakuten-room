<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>楽天ROOMおすすめ商品</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;

  background: #f5f5f5;
  color: #333;
}


/* ================================
ヘッダー
================================ */

header {
  background: #bf0000;
  color: white;

  padding: 30px 20px;

  text-align: center;
}

header h1 {
  margin: 0 0 10px;
  font-size: 28px;
}

header p {
  margin: 0;
  font-size: 16px;
}


/* ================================
メイン
================================ */

.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 20px;
}


/* ================================
検索
================================ */

.search-box {
  background: white;

  padding: 20px;

  border-radius: 12px;

  box-shadow:
    0 2px 10px
    rgba(0, 0, 0, .08);

  margin-bottom: 25px;
}

.search-box h2 {
  margin-top: 0;
}

.search-area {
  display: flex;
  gap: 10px;
}

.search-area input {
  flex: 1;

  padding: 14px;

  border: 1px solid #ccc;

  border-radius: 6px;

  font-size: 16px;
}

.search-area button {
  padding: 14px 25px;

  background: #bf0000;

  color: white;

  border: none;

  border-radius: 6px;

  font-size: 16px;

  cursor: pointer;
}

.search-area button:hover {
  background: #990000;
}

.search-area button:disabled {
  background: #999;
  cursor: not-allowed;
}


/* ================================
商品一覧
================================ */

#products {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(230px, 1fr)
    );

  gap: 20px;
}


/* ================================
商品カード
================================ */

.product {
  background: white;

  border-radius: 12px;

  overflow: hidden;

  box-shadow:
    0 2px 10px
    rgba(0, 0, 0, .08);

  display: flex;

  flex-direction: column;
}

.product img {
  width: 100%;

  height: 220px;

  object-fit: contain;

  background: #fff;

  padding: 10px;
}

.product-info {
  padding: 15px;

  display: flex;

  flex-direction: column;

  flex: 1;
}

.product-name {
  font-size: 15px;

  font-weight: bold;

  line-height: 1.5;

  margin-bottom: 10px;

  display: -webkit-box;

  -webkit-line-clamp: 3;

  -webkit-box-orient: vertical;

  overflow: hidden;
}

.price {
  color: #bf0000;

  font-size: 20px;

  font-weight: bold;

  margin-bottom: 15px;
}

.product a {
  display: block;

  margin-top: auto;

  text-align: center;

  padding: 12px;

  background: #bf0000;

  color: white;

  text-decoration: none;

  border-radius: 6px;

  font-weight: bold;
}

.product a:hover {
  background: #990000;
}


/* ================================
メッセージ
================================ */

.message {
  background: white;

  padding: 30px;

  border-radius: 10px;

  text-align: center;

  grid-column: 1 / -1;
}


/* ================================
スマホ
================================ */

@media (max-width: 600px) {

  .search-area {
    flex-direction: column;
  }

  header h1 {
    font-size: 24px;
  }

}

</style>

</head>


<body>

<header>

  <h1>
    楽天ROOMおすすめ商品
  </h1>

  <p>
    楽天ROOMで紹介しているおすすめ商品
  </p>

</header>


<div class="container">

  <div class="search-box">

    <h2>
      商品を検索
    </h2>

    <div class="search-area">

      <input
        type="text"
        id="keyword"
        placeholder="例：スニーカー、バッグ、家電"
      >

      <button
        type="button"
        id="searchButton"
        onclick="searchProducts()"
      >
        検索
      </button>

    </div>

  </div>


  <div id="products">

    <div class="message">

      キーワードを入力して
      「検索」を押してください。

    </div>

  </div>

</div>


<script>

/* =================================
Cloudflare Worker設定
================================= */

const WORKER_API =
  "https://rakuten-room.you626-m.workers.dev/api/search";


/* =================================
待機処理
================================= */

function sleep(ms) {

  return new Promise(
    resolve => setTimeout(resolve, ms)
  );

}


/* =================================
楽天商品検索
================================= */

async function searchProducts() {

  const keywordInput =
    document.getElementById("keyword");

  const searchButton =
    document.getElementById("searchButton");

  const products =
    document.getElementById("products");


  const keyword =
    keywordInput.value.trim();


  /* キーワード未入力 */

  if (!keyword) {

    alert(
      "検索キーワードを入力してください。"
    );

    return;

  }


  /* 検索中は連打禁止 */

  searchButton.disabled = true;

  searchButton.textContent =
    "検索中...";


  products.innerHTML = `

    <div class="message">

      商品を検索しています...

    </div>

  `;


  const apiUrl =
    WORKER_API +
    "?keyword=" +
    encodeURIComponent(keyword);


  let lastError = null;


  /* ================================
  最大3回試行
  ================================= */

  for (
    let attempt = 1;
    attempt <= 3;
    attempt++
  ) {

    try {

      if (attempt > 1) {

        products.innerHTML = `

          <div class="message">

            接続を再試行しています...
            <br><br>

            ${attempt} / 3 回目

          </div>

        `;

        await sleep(1500);

      }


      const response =
        await fetch(apiUrl);


      /* JSON取得 */

      let data;

      try {

        data =
          await response.json();

      }

      catch (jsonError) {

        throw new Error(
          "サーバーから正しいデータを取得できませんでした。"
        );

      }


      /* APIエラー */

      if (!response.ok) {

        const errorMessage =

          data.error

          ||

          data.details?.errorMessage

          ||

          data.details?.errors?.errorMessage

          ||

          data.message

          ||

          `HTTP ${response.status}`;


        throw new Error(
          errorMessage
        );

      }


      /* ================================
      商品データ取得
      ================================= */

      const items =

        data.Items

        ||

        data.items

        ||

        [];


      /* 商品なし */

      if (
        !Array.isArray(items)
        ||
        items.length === 0
      ) {

        products.innerHTML = `

          <div class="message">

            商品が見つかりませんでした。

          </div>

        `;

        return;

      }


      /* 商品一覧をクリア */

      products.innerHTML = "";


      /* ================================
      商品カード作成
      ================================= */

      items.forEach(
        function(item) {

          const product =
            item.Item ||
            item;


          /* 商品名 */

          const itemName =
            product.itemName ||
            "商品名なし";


          /* 価格 */

          const rawPrice =
            product.itemPrice;


          const itemPrice =

            rawPrice !== undefined
            &&
            rawPrice !== null
            &&
            rawPrice !== ""

              ?

              Number(rawPrice)
                .toLocaleString()

              :

              "価格情報なし";


          /* 商品URL */

          const itemUrl =

            product.affiliateUrl

            ||

            product.itemUrl

            ||

            "#";


          /* 商品画像 */

          let imageUrl = "";


          if (
            product.mediumImageUrls
            &&
            product.mediumImageUrls.length > 0
          ) {

            const image =
              product.mediumImageUrls[0];


            imageUrl =

              image.imageUrl

              ||

              image;

          }


          /* 画像なし */

          if (!imageUrl) {

            imageUrl =

              "data:image/svg+xml;charset=UTF-8,"

              +

              encodeURIComponent(

                `<svg xmlns="http://www.w3.org/2000/svg"
                  width="400"
                  height="400">

                  <rect
                    width="100%"
                    height="100%"
                    fill="#eeeeee"
                  />

                  <text
                    x="50%"
                    y="50%"
                    text-anchor="middle"
                    dominant-baseline="middle"
                    fill="#999999"
                    font-size="20"
                  >

                    No Image

                  </text>

                </svg>`

              );

          }


          /* カード作成 */

          const card =
            document.createElement("div");


          card.className =
            "product";


          card.innerHTML = `

            <img

              src="${escapeHtml(imageUrl)}"

              alt="${escapeHtml(itemName)}"

            >


            <div class="product-info">


              <div class="product-name">

                ${escapeHtml(itemName)}

              </div>


              <div class="price">

                ${escapeHtml(itemPrice)}円

              </div>


              <a

                href="${escapeHtml(itemUrl)}"

                target="_blank"

                rel="noopener noreferrer"

              >

                楽天市場で見る

              </a>


            </div>

          `;


          products.appendChild(card);

        }
      );


      /* 成功したので終了 */

      return;

    }

    catch (error) {

      console.error(
        `検索 ${attempt}回目失敗:`,
        error
      );

      lastError =
        error;

    }

  }


  /* =================================
  3回すべて失敗
  ================================= */

  products.innerHTML = `

    <div class="message">

      商品を取得できませんでした。

      <br><br>

      ${escapeHtml(
        lastError
          ? lastError.message
          : "原因不明のエラー"
      )}

      <br><br>

      少し時間をおいて、
      もう一度検索してください。

    </div>

  `;


  /* ボタンを元に戻す */

  searchButton.disabled =
    false;

  searchButton.textContent =
    "検索";

}


/* =================================
HTMLエスケープ
================================= */

function escapeHtml(text) {

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =================================
Enterキーで検索
================================= */

document
  .getElementById("keyword")
  .addEventListener(

    "keydown",

    function(event) {

      if (
        event.key === "Enter"
      ) {

        searchProducts();

      }

    }

  );

</script>

</body>

</html>
