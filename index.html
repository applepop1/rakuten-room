<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>楽天ROOMおすすめ商品</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    background: #f5f5f5;
    color: #333;
}

header {
    background: #bf0000;
    color: white;
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 10px 0 0;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px;
}

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

.search-box input {
    flex: 1;
    padding: 15px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 6px;
}

.search-box button {
    background: #bf0000;
    color: white;
    border: none;
    padding: 0 25px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
}

.search-box button:hover {
    background: #990000;
}

.message {
    text-align: center;
    margin-bottom: 20px;
    color: #666;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    transition: .2s;
}

.product:hover {
    transform: translateY(-3px);
}

.product img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #eee;
}

.product-info {
    padding: 15px;
}

.product-name {
    font-size: 15px;
    line-height: 1.6;
    height: 72px;
    overflow: hidden;
}

.price {
    color: #bf0000;
    font-size: 20px;
    font-weight: bold;
    margin: 12px 0;
}

.product a {
    display: block;
    background: #bf0000;
    color: white;
    text-align: center;
    padding: 12px;
    text-decoration: none;
    border-radius: 5px;
}

.product a:hover {
    background: #990000;
}

@media (max-width: 600px) {

    header h1 {
        font-size: 22px;
    }

    .search-box {
        flex-direction: column;
    }

    .search-box button {
        padding: 15px;
    }

}
</style>
</head>

<body>

<header>
    <h1>楽天ROOMおすすめ商品</h1>
    <p>おすすめの商品を検索・紹介します</p>
</header>

<div class="container">

    <div class="search-box">
        <input
            type="text"
            id="keyword"
            placeholder="商品を検索 例：バッグ、スニーカー、家電"
        >

        <button onclick="searchProducts()">
            商品を検索
        </button>
    </div>

    <div class="message" id="message">
        キーワードを入力して商品を検索してください
    </div>

    <div class="products" id="products">

    </div>

</div>

<script>

function searchProducts() {

    const keyword = document.getElementById("keyword").value;

    if (!keyword) {
        alert("検索したい商品を入力してください");
        return;
    }

    document.getElementById("message").textContent =
        "「" + keyword + "」の商品を検索しています...";

    /*
    次の段階で、
    ここに楽天市場APIとの接続処理を追加します。
    */

    setTimeout(() => {

        document.getElementById("message").textContent =
            "楽天API接続準備中です。「" +
            keyword +
            "」の検索機能を作成できます。";

    }, 500);

}

</script>

</body>
</html>
