<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>楽天ROOM 商品検索</title>

<style>

/* ========================================
   全体
======================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;

  background: #f5f5f5;
  color: #333;
}


/* ========================================
   ヘッダー
======================================== */

header {
  background: #ffffff;
  border-bottom: 1px solid #dddddd;
  padding: 20px;
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
}

h1 {
  margin: 0;
  font-size: 24px;
}

.subtitle {
  margin-top: 8px;
  color: #777777;
  font-size: 14px;
}


/* ========================================
   検索エリア
======================================== */

.search-area {
  max-width: 1400px;
  margin: 20px auto;
  padding: 20px;

  background: #ffffff;

  border-radius: 10px;
  box-shadow:
    0 2px 8px
    rgba(0, 0, 0, 0.08);
}

.search-form {
  display: flex;
  gap: 10px;
}

#keyword {
  flex: 1;

  height: 48px;

  padding:
    0
    15px;

  font-size: 16px;

  border:
    1px
    solid
    #cccccc;

  border-radius: 6px;
}

#searchButton {
  width: 140px;
  height: 48px;

  border: none;
  border-radius: 6px;

  background: #bf0000;
  color: #ffffff;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;
}

#searchButton:hover {
  background: #990000;
}

#searchButton:disabled {
  background: #999999;
  cursor: not-allowed;
}


/* ========================================
   情報表示
======================================== */

.status-area {
  max-width: 1400px;
  margin:
    0
    auto
    20px;

  padding:
    0
    20px;
}

#status {
  padding: 12px 15px;

  background: #ffffff;

  border-radius: 6px;

  font-size: 14px;
}

.status-loading {
  color: #0066cc;
}

.status-error {
  color: #cc0000;
}

.status-success {
  color: #333333;
}


/* ========================================
   商品一覧
======================================== */

.product-container {
  max-width: 1400px;

  margin:
    0
    auto;

  padding:
    0
    20px
    40px;
}

#productList {

  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(240px, 1fr)
    );

  gap: 20px;
}


/* ========================================
   商品カード
======================================== */

.product-card {

  background: #ffffff;

  border-radius: 10px;

  overflow: hidden;

  box-shadow:
    0 2px 8px
    rgba(0, 0, 0, 0.08);

  display: flex;

  flex-direction: column;
}


/* ========================================
   商品画像
======================================== */

.product-image-area {

  width: 100%;

  aspect-ratio: 1 / 1;

  background: #f3f3f3;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;
}

.product-image {

  width: 100%;

  height: 100%;

  object-fit: contain;

  padding: 10px;
}


/* ========================================
   商品情報
======================================== */

.product-info {

  padding: 15px;

  display: flex;

  flex-direction: column;

  flex: 1;
}

.product-name {

  margin: 0;

  font-size: 14px;

  line-height: 1.6;

  font-weight: 600;

  display: -webkit-box;

  -webkit-line-clamp: 3;

  -webkit-box-orient: vertical;

  overflow: hidden;

  min-height: 68px;
}

.price {

  margin-top: 12px;

  font-size: 20px;

  font-weight: bold;

  color: #bf0000;
}

.shop-name {

  margin-top: 8px;

  font-size: 13px;

  color: #777777;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* ========================================
   ボタン
======================================== */

.button-area {

  margin-top: auto;

  padding-top: 15px;

  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 8px;
}

.product-link {

  display: flex;

  align-items: center;

  justify-content: center;

  height: 42px;

  border-radius: 5px;

  text-decoration: none;

  font-size: 13px;

  font-weight: bold;

  background: #eeeeee;

  color: #333333;
}

.product-link:hover {

  background: #dddddd;
}


/* ========================================
   ROOM投稿ボタン
======================================== */

.room-button {

  height: 42px;

  border: none;

  border-radius: 5px;

  background: #bf0000;

  color: #ffffff;

  font-size: 13px;

  font-weight: bold;

  cursor: pointer;
}

.room-button:hover {

  background: #990000;
}


/* ========================================
   ページ移動
======================================== */

.pagination {

  max-width: 1400px;

  margin:
    0
    auto
    40px;

  padding:
    0
    20px;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 15px;
}

.pagination button {

  height: 42px;

  min-width: 100px;

  border: none;

  border-radius: 5px;

  background: #333333;

  color: #ffffff;

  font-size: 14px;

  cursor: pointer;
}

.pagination button:hover {

  background: #000000;
}

.pagination button:disabled {

  background: #aaaaaa;

  cursor: not-allowed;
}

#pageInfo {

  min-width: 100px;

  text-align: center;

  font-size: 14px;
}


/* ========================================
   スマホ
======================================== */

@media screen and (max-width: 600px) {

  .search-form {

    flex-direction: column;
  }

  #searchButton {

    width: 100%;
  }

  #productList {

    grid-template-columns:
      repeat(
        2,
        1fr
      );

    gap: 10px;
  }

  .product-info {

    padding: 10px;
  }

  .product-name {

    font-size: 12px;

    min-height: 58px;
  }

  .price {

    font-size: 16px;
  }

  .shop-name {

    font-size: 11px;
  }

  .button-area {

    grid-template-columns: 1fr;
  }

  .product-link,
  .room-button {

    font-size: 12px;
  }

}

</style>

</head>

<body>


<!-- ========================================
     ヘッダー
======================================== -->

<header>

  <div class="header-inner">

    <h1>
      楽天ROOM 商品検索
    </h1>

    <div class="subtitle">

      楽天市場の商品を検索してROOM投稿用に確認できます

    </div>

  </div>

</header>



<!-- ========================================
     検索エリア
======================================== -->

<div class="search-area">

  <div class="search-form">

    <input
      type="text"
      id="keyword"
      placeholder="検索したい商品を入力"
    >

    <button
      id="searchButton"
      type="button"
    >
      検索
    </button>

  </div>

</div>



<!-- ========================================
     ステータス
======================================== -->

<div class="status-area">

  <div
    id="status"
    class="status-success"
  >

    キーワードを入力して検索してください。

  </div>

</div>



<!-- ========================================
     商品一覧
======================================== -->

<div class="product-container">

  <div
    id="productList"
  ></div>

</div>



<!-- ========================================
     ページ移動
======================================== -->

<div class="pagination">

  <button
    id="prevButton"
    type="button"
    disabled
  >
    ← 前へ
  </button>


  <div
    id="pageInfo"
  >

    1 ページ

  </div>


  <button
    id="nextButton"
    type="button"
    disabled
  >
    次へ →
  </button>

</div>



<script>

/* ========================================
   API URL
======================================== */

const API_BASE_URL =
  "https://rakuten-room.yo626-m.workers.dev/api/search";


/* ========================================
   HTML要素
======================================== */

const keywordInput =
  document.getElementById("keyword");

const searchButton =
  document.getElementById("searchButton");

const productList =
  document.getElementById("productList");

const statusElement =
  document.getElementById("status");

const prevButton =
  document.getElementById("prevButton");

const nextButton =
  document.getElementById("nextButton");

const pageInfo =
  document.getElementById("pageInfo");


/* ========================================
   状態管理
======================================== */

let currentKeyword = "";

let currentPage = 1;

let maxPage = 1;

let isLoading = false;


/* ========================================
   検索実行
======================================== */

async function searchProducts(
  keyword,
  page
) {

  if (
    isLoading
  ) {

    return;

  }


  /* ----------------------------------------
     キーワード確認
  ---------------------------------------- */

  if (
    !keyword ||
    keyword.trim() === ""
  ) {

    setStatus(
      "キーワードを入力してください。",
      "error"
    );

    return;

  }


  /* ----------------------------------------
     ローディング開始
  ---------------------------------------- */

  isLoading = true;

  searchButton.disabled = true;

  prevButton.disabled = true;

  nextButton.disabled = true;


  setStatus(
    "商品を検索しています...",
    "loading"
  );


  productList.innerHTML = "";


  try {


    /* ========================================
       API URL作成
    ======================================== */

    const apiUrl =
      new URL(
        API_BASE_URL
      );


    apiUrl.searchParams.set(
      "keyword",
      keyword
    );


    apiUrl.searchParams.set(
      "page",
      page
    );


    /* ========================================
       APIアクセス
    ======================================== */

    const response =
      await fetch(
        apiUrl.toString(),
        {
          method: "GET"
        }
      );


    /* ========================================
       JSON取得
    ======================================== */

    const data =
      await response.json();


    /* ========================================
       APIエラー
    ======================================== */

    if (
      !response.ok
    ) {

      throw new Error(
        data.error ||
        "検索に失敗しました。"
      );

    }


    /* ========================================
       商品データ確認
    ======================================== */

    if (
      !data.Items ||
      !Array.isArray(
        data.Items
      )
    ) {

      throw new Error(
        "商品データの形式が正しくありません。"
      );

    }


    /* ========================================
       状態更新
    ======================================== */

    currentKeyword =
      keyword;


    currentPage =
      Number(
        data.page ||
        page
      );


    maxPage =
      Number(
        data.pageCount ||
        1
      );


    /* ========================================
       商品表示
    ======================================== */

    displayProducts(
      data.Items
    );


    /* ========================================
       件数表示
    ======================================== */

    const count =
      Number(
        data.count ||
        0
      );


    const first =
      Number(
        data.first ||
        0
      );


    const last =
      Number(
        data.last ||
        0
      );


    setStatus(
      `${count.toLocaleString()}件中 ${first}〜${last}件を表示しています。`,
      "success"
    );


    /* ========================================
       ページ情報
    ======================================== */

    pageInfo.textContent =
      `${currentPage} / ${maxPage} ページ`;


    /* ========================================
       前へボタン
    ======================================== */

    prevButton.disabled =
      currentPage <= 1;


    /* ========================================
       次へボタン
    ======================================== */

    nextButton.disabled =
      currentPage >= maxPage;


  } catch (
    error
  ) {


    console.error(
      error
    );


    setStatus(
      `エラー：${error.message}`,
      "error"
    );


    productList.innerHTML = "";


    pageInfo.textContent =
      `${page} ページ`;


  } finally {


    isLoading = false;

    searchButton.disabled = false;


  }

}



/* ========================================
   商品表示
======================================== */

function displayProducts(
  items
) {


  productList.innerHTML = "";


  if (
    items.length === 0
  ) {

    productList.innerHTML =
      `
      <div>
        商品が見つかりませんでした。
      </div>
      `;

    return;

  }


  items.forEach(
    function(item) {


      /* ====================================
         商品URL
      ==================================== */

      const itemUrl =
        item.itemUrl ||
        "";


      /* ====================================
         商品名
      ==================================== */

      const itemName =
        item.itemName ||
        "商品名なし";


      /* ====================================
         商品価格
      ==================================== */

      const itemPrice =
        Number(
          item.itemPrice ||
          0
        );


      /* ====================================
         ショップ名
      ==================================== */

      const shopName =
        item.shopName ||
        "";


      /* ====================================
         商品画像
      ==================================== */

      let imageUrl = "";


      if (
        item.mediumImageUrls &&
        item.mediumImageUrls.length > 0
      ) {

        const image =
          item.mediumImageUrls[0];


        if (
          typeof image === "string"
        ) {

          imageUrl =
            image;

        } else if (
          image.imageUrl
        ) {

          imageUrl =
            image.imageUrl;

        }

      }


      /* ====================================
         カード作成
      ==================================== */

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "product-card";


      /* ====================================
         HTML作成
      ==================================== */

      card.innerHTML =
        `

        <div
          class="product-image-area"
        >

          <img
            class="product-image"
            src="${escapeHtml(imageUrl)}"
            alt="${escapeHtml(itemName)}"
          >

        </div>


        <div
          class="product-info"
        >


          <div
            class="product-name"
          >

            ${escapeHtml(itemName)}

          </div>


          <div
            class="price"
          >

            ¥${itemPrice.toLocaleString()}

          </div>


          <div
            class="shop-name"
          >

            ${escapeHtml(shopName)}

          </div>


          <div
            class="button-area"
          >


            <a
              class="product-link"
              href="${escapeHtml(itemUrl)}"
              target="_blank"
              rel="noopener noreferrer"
            >

              商品を見る

            </a>


            <button
              class="room-button"
              type="button"
              data-url="${escapeHtml(itemUrl)}"
            >

              ROOMに投稿

            </button>


          </div>


        </div>

        `;


      /* ====================================
         ROOMボタン
      ==================================== */

      const roomButton =
        card.querySelector(
          ".room-button"
        );


      roomButton.addEventListener(
        "click",
        function() {

          postToRoom(
            itemUrl
          );

        }
      );


      /* ====================================
         商品追加
      ==================================== */

      productList.appendChild(
        card
      );


    }
  );

}



/* ========================================
   ROOM投稿
======================================== */

function postToRoom(
  itemUrl
) {


  if (
    !itemUrl
  ) {

    alert(
      "商品URLを取得できませんでした。"
    );

    return;

  }


  /*
   ----------------------------------------

   現在は楽天ROOM投稿画面へ
   商品URLを渡して開く方式です。

   実際の楽天ROOM投稿URL形式に合わせて
   次の段階で調整します。

   ----------------------------------------
  */


  const roomUrl =
    "https://room.rakuten.co.jp/";


  window.open(
    roomUrl,
    "_blank"
  );


  /*
   商品URLをクリップボードへコピー
  */

  if (
    navigator.clipboard
  ) {

    navigator.clipboard.writeText(
      itemUrl
    )
    .then(
      function() {

        alert(
          "楽天ROOMを開きました。\n\n商品URLをコピーしました。\nROOM投稿画面で貼り付けてください。"
        );

      }
    )
    .catch(
      function() {

        alert(
          "楽天ROOMを開きました。\n商品URL：\n" +
          itemUrl
        );

      }
    );

  } else {

    alert(
      "商品URL：\n" +
      itemUrl
    );

  }

}



/* ========================================
   HTMLエスケープ
======================================== */

function escapeHtml(
  value
) {

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}



/* ========================================
   ステータス表示
======================================== */

function setStatus(
  message,
  type
) {


  statusElement.textContent =
    message;


  statusElement.className =
    "";


  if (
    type === "loading"
  ) {

    statusElement.classList.add(
      "status-loading"
    );

  }


  if (
    type === "error"
  ) {

    statusElement.classList.add(
      "status-error"
    );

  }


  if (
    type === "success"
  ) {

    statusElement.classList.add(
      "status-success"
    );

  }

}



/* ========================================
   検索ボタン
======================================== */

searchButton.addEventListener(
  "click",
  function() {


    const keyword =
      keywordInput.value.trim();


    currentPage = 1;


    searchProducts(
      keyword,
      currentPage
    );


  }
);



/* ========================================
   Enterキー検索
======================================== */

keywordInput.addEventListener(
  "keydown",
  function(
    event
  ) {


    if (
      event.key === "Enter"
    ) {

      const keyword =
        keywordInput.value.trim();


      currentPage = 1;


      searchProducts(
        keyword,
        currentPage
      );

    }


  }
);



/* ========================================
   前ページ
======================================== */

prevButton.addEventListener(
  "click",
  function() {


    if (
      currentPage <= 1
    ) {

      return;

    }


    searchProducts(
      currentKeyword,
      currentPage - 1
    );


  }
);



/* ========================================
   次ページ
======================================== */

nextButton.addEventListener(
  "click",
  function() {


    if (
      currentPage >= maxPage
    ) {

      return;

    }


    searchProducts(
      currentKeyword,
      currentPage + 1
    );


  }
);

</script>

</body>
</html>
