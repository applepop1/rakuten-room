<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>楽天ROOMおすすめ商品</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;

  background: #f5f5f5;
  color: #333;
}


/* ================================
ヘッダー
================================ */

header {
  background: #bf0000;
  color: white;

  padding: 30px 20px;

  text-align: center;
}

header h1 {
  margin: 0 0 10px;
  font-size: 28px;
}

header p {
  margin: 0;
  font-size: 16px;
}


/* ================================
メイン
================================ */

.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 20px;
}


/* ================================
検索
================================ */

.search-box {
  background: white;

  padding: 20px;

  border-radius: 12px;

  box-shadow:
    0 2px 10px
    rgba(0, 0, 0, .08);

  margin-bottom: 25px;
}

.search-box h2 {
  margin-top: 0;
}

.search-area {
  display: flex;
  gap: 10px;
}

.search-area input {
  flex: 1;

  padding: 14px;

  border: 1px solid #ccc;

  border-radius: 6px;

  font-size: 16px;
}

.search-area button {
  padding: 14px 25px;

  background: #bf0000;

  color: white;

  border: none;

  border-radius: 6px;

  font-size: 16px;

  cursor: pointer;
}

.search-area button:hover {
  background: #990000;
}

.search-area button:disabled {
  background: #999;
  cursor: not-allowed;
}


/* ================================
商品一覧
================================ */

#products {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(230px, 1fr)
    );

  gap: 20px;
}


/* ================================
商品カード
================================ */

.product {
  background: white;

  border-radius: 12px;

  overflow: hidden;

  box-shadow:
    0 2px 10px
    rgba(0, 0, 0, .08);

  display: flex;

  flex-direction: column;
}

.product img {
  width: 100%;

  height: 220px;

  object-fit: contain;

  background: #fff;

  padding: 10px;
}

.product-info {
  padding: 15px;

  display: flex;

  flex-direction: column;

  flex: 1;
}

.product-name {
  font-size: 15px;

  font-weight: bold;

  line-height: 1.5;

  margin-bottom: 10px;

  display: -webkit-box;

  -webkit-line-clamp: 3;

  -webkit-box-orient: vertical;

  overflow: hidden;
}

.price {
  color: #bf0000;

  font-size: 20px;

  font-weight: bold;

  margin-bottom: 15px;
}

.product a {
  display: block;

  margin-top: auto;

  text-align: center;

  padding: 12px;

  background: #bf0000;

  color: white;

  text-decoration: none;

  border-radius: 6px;

  font-weight: bold;
}

.product a:hover {
  background: #990000;
}


/* ================================
メッセージ
================================ */

.message {
  background: white;

  padding: 30px;

  border-radius: 10px;

  text-align: center;

  grid-column: 1 / -1;
}


/* ================================
スマホ
================================ */

@media (max-width: 600px) {

  .search-area {
    flex-direction: column;
  }

  header h1 {
    font-size: 24px;
  }

}

  /* ================================
もっと見る
================================ */

#load-more-area {

  text-align: center;

  margin:
    30px 0 50px;

}

#load-more {

  padding:
    15px 60px;

  background: #bf0000;

  color: white;

  border: none;

  border-radius: 6px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}

#load-more:hover {

  background: #990000;

}
/* ================================
もっと見る
================================ */

.load-more-container {

  grid-column: 1 / -1;

  text-align: center;

  padding:
    20px 0 40px;

}


.load-more-button {

  padding:
    15px 50px;

  background:
    #bf0000;

  color:
    white;

  border:
    none;

  border-radius:
    8px;

  font-size:
    16px;

  font-weight:
    bold;

  cursor:
    pointer;

}


.load-more-button:hover {

  background:
    #990000;

}
</style>

</head>


<body>

<header>

  <h1>
    楽天ROOMおすすめ商品
  </h1>

  <p>
    楽天ROOMで紹介しているおすすめ商品
  </p>

</header>


<div class="container">

  <div class="search-box">

    <h2>
      商品を検索
    </h2>

    <div class="search-area">

      <input
        type="text"
        id="keyword"
        placeholder="例：スニーカー、バッグ、家電"
      >

      <button
        type="button"
        id="searchButton"
        onclick="searchProducts()"
      >
        検索
      </button>

    </div>

  </div>


<div id="products">

  <div class="message">

    キーワードを入力して
    「検索」を押してください。

  </div>

</div>

<div id="load-more-area">

  <button
    id="load-more"
    type="button"
    onclick="loadMoreProducts()"
    style="display:none;"
  >
    もっと見る
  </button>

</div>

</div>


<script>

/* =================================
Cloudflare Worker
================================= */

const WORKER_API =
  "https://rakuten-room.you626-m.workers.dev/api/search";


/* =================================
設定
================================= */

const INITIAL_COUNT = 50;

const LOAD_MORE_COUNT = 25;

const MAX_COUNT = 100;


/* =================================
変数
================================= */

let currentKeyword = "";

let allProducts = [];

let displayedCount = 0;


/* =================================
商品検索
================================= */

async function searchProducts() {

  const keyword =
    document
      .getElementById("keyword")
      .value
      .trim();


  if (!keyword) {

    alert(
      "検索キーワードを入力してください。"
    );

    return;

  }


  currentKeyword =
    keyword;


  allProducts =
    [];


  displayedCount =
    0;


  const products =
    document.getElementById("products");


  products.innerHTML = `
    <div class="message">
      商品を検索しています...
    </div>
  `;


  try {

    /*
    最大100件取得するため
    30件 × 4ページ取得
    */

    const pages =
      [1, 2, 3, 4];


    const results =
      await Promise.all(

        pages.map(
          async function(page) {

            const apiUrl =
              WORKER_API +
              "?keyword=" +
              encodeURIComponent(keyword) +
              "&page=" +
              page;


            const response =
              await fetch(apiUrl);


            const data =
              await response.json();


            if (!response.ok) {

              throw new Error(

                data.error ||
                data.details?.errors?.errorMessage ||
                "商品検索に失敗しました。"

              );

            }


            return (
              data.Items ||
              data.items ||
              []
            );

          }
        )

      );


    /*
    4ページ分を1つにまとめる
    */

    allProducts =
      results
        .flat()
        .slice(
          0,
          MAX_COUNT
        );


    if (
      allProducts.length === 0
    ) {

      products.innerHTML = `
        <div class="message">
          商品が見つかりませんでした。
        </div>
      `;

      return;

    }


    products.innerHTML =
      "";


    /*
    最初は50件表示
    */

    showMoreProducts(
      INITIAL_COUNT
    );


  } catch (error) {

    console.error(
      "商品検索エラー:",
      error
    );


    products.innerHTML = `
      <div class="message">
        商品を取得できませんでした。
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}


/* =================================
商品を追加表示
================================= */

function showMoreProducts(count) {

  const products =
    document.getElementById("products");


  const endIndex =
    Math.min(
      displayedCount + count,
      allProducts.length,
      MAX_COUNT
    );


  for (
    let i = displayedCount;
    i < endIndex;
    i++
  ) {

    const item =
      allProducts[i];


    addProductCard(
      item
    );

  }


  displayedCount =
    endIndex;


  updateLoadMoreButton();

}


/* =================================
もっと見るボタン
================================= */

function updateLoadMoreButton() {

  const oldButton =
    document.getElementById(
      "loadMoreContainer"
    );


  if (oldButton) {

    oldButton.remove();

  }


  if (
    displayedCount >= allProducts.length ||
    displayedCount >= MAX_COUNT
  ) {

    return;

  }


  const products =
    document.getElementById(
      "products"
    );


  const container =
    document.createElement(
      "div"
    );


  container.id =
    "loadMoreContainer";


  container.className =
    "load-more-container";


  const button =
    document.createElement(
      "button"
    );


  button.className =
    "load-more-button";


  button.textContent =
    "もっと見る";


  button.addEventListener(
    "click",
    function() {

      showMoreProducts(
        LOAD_MORE_COUNT
      );

    }
  );


  container.appendChild(
    button
  );


  products.appendChild(
    container
  );

}


/* =================================
商品カード追加
================================= */

function addProductCard(item) {

  const product =
    item.Item ||
    item;


  const itemName =
    product.itemName ||
    "商品名なし";


  const rawPrice =
    product.itemPrice;


  const itemPrice =
    rawPrice !== undefined &&
    rawPrice !== null &&
    rawPrice !== ""

      ? Number(rawPrice)
          .toLocaleString()

      : "価格情報なし";


  const itemUrl =
    product.affiliateUrl ||
    product.itemUrl ||
    "#";


  let imageUrl =
    "";


  if (
    product.mediumImageUrls &&
    product.mediumImageUrls.length > 0
  ) {

    const image =
      product.mediumImageUrls[0];


    imageUrl =
      image.imageUrl ||
      image;

  }


  if (!imageUrl) {

    imageUrl =
      "data:image/svg+xml;charset=UTF-8," +

      encodeURIComponent(`

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="400"
          height="400"
        >

          <rect
            width="100%"
            height="100%"
            fill="#eeeeee"
          />

          <text
            x="50%"
            y="50%"
            text-anchor="middle"
            dominant-baseline="middle"
            fill="#999999"
            font-size="20"
          >

            No Image

          </text>

        </svg>

      `);

  }


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "product";


  card.innerHTML = `

    <img
      src="${escapeHtml(imageUrl)}"
      alt="${escapeHtml(itemName)}"
    >

    <div class="product-info">

      <div class="product-name">

        ${escapeHtml(itemName)}

      </div>


      <div class="price">

        ${escapeHtml(itemPrice)}円

      </div>


      <a
        href="${escapeHtml(itemUrl)}"
        target="_blank"
        rel="noopener noreferrer"
      >

        楽天市場で見る

      </a>

    </div>

  `;


  document
    .getElementById("products")
    .appendChild(
      card
    );

}


/* =================================
HTMLエスケープ
================================= */

function escapeHtml(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =================================
Enterキー
================================= */

document
  .getElementById("keyword")
  .addEventListener(

    "keydown",

    function(event) {

      if (
        event.key === "Enter"
      ) {

        searchProducts();

      }

    }

  );

</script>
  
</body>

</html>
